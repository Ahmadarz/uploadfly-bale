  <!-- اسپلش کوتاه: فقط تا وقتی داده‌ها برسد -->
  <div id="splash" class="layer">
    <img src="/static/logo.jpg" class="splash-logo" alt="">
    <p class="wordmark">UPLOADFLY</p>
  </div>

  <!-- خطا (مثلاً باز شدن خارج از تلگرام) -->
  <div id="error" class="layer hidden">
    <div class="card error-box">
      <p class="wordmark">UPLOADFLY</p>
      <p id="error-text"></p>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="header">
      <div class="hello">
        <div id="hd-avatar" class="avatar sm"></div>
        <div class="hello-text"><span class="wordmark small">UPLOADFLY</span><b id="hd-name"></b></div>
      </div>
      <span class="status-pill"><span id="status-dot" class="dot"></span><bdi id="status-text"></bdi></span>
    </header>

    <!-- خانه -->
    <main id="page-home" class="page active">
      <section id="home-seller" class="hidden">
        <div id="hero-wallet" class="hero-card reveal" role="button" tabindex="0">
          <div class="hero-top">
            <div class="hero-balance">
              <span class="hero-label" data-i18n="balance"></span>
              <p class="balance num"><span id="st-balance">0</span><span class="cur">تومان</span></p>
              <span id="st-withdraw" class="hero-sub"></span>
            </div>
            <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
              <circle class="ring-track" cx="50" cy="50" r="40"/>
              <circle id="ring-value" class="ring-value" cx="50" cy="50" r="40"/>
              <text id="ring-text" class="ring-text" x="50" y="50" text-anchor="middle" dominant-baseline="central">0%</text>
            </svg>

    <!-- ۳: محتواها -->
    <div id="sce-p-items" class="sce-page">
      <p class="wiz-q" data-i18n="sce_q_items"></p>
      <p id="sce-items-hint" class="muted small"></p>
      <div id="sce-items" class="card list pick-list"></div>
      <p id="sce-no-products" class="muted small center hidden" data-i18n="sce_no_products"></p>
    </div>

    <!-- تنظیمات: خصوصی و تاریخ پایان -->
    <div id="sce-p-settings" class="sce-page">
      <label class="switch-row">
        <span><b data-i18n="sce_private"></b><small data-i18n="sce_private_hint"></small></span>
        <input id="sce-private2" type="checkbox"><i class="switch"></i>
      </label>
      <div class="date-row">
        <span><b data-i18n="expiry_label"></b><small data-i18n="sce_expiry_hint"></small></span>
        <div class="date-field"><input id="sce-expiry" type="date"><button id="sce-expiry-clear" class="text-btn" data-i18n="expiry_none"></button></div>
      </div>
    </div>

    <!-- ساخته شد -->
    <div id="sce-p-done" class="sce-page done-page">
      <span class="done-icon"><svg><use href="#i-check"/></svg></span>
      <h3 data-i18n="sce_done_title"></h3>
      <p class="muted" data-i18n="sce_done_text"></p>
      <code id="sce-done-link" class="done-link"></code>
      <button id="sce-done-copy" class="btn-accent wide"><svg><use href="#i-link"/></svg><span data-i18n="sc_copy_bio"></span></button>
      <button id="sce-done-story" class="btn-soft wide"><svg><use href="#i-story"/></svg><span data-i18n="story_title"></span></button>
      <button id="sce-done-view" class="btn-soft wide"><svg><use href="#i-eye"/></svg><span data-i18n="sc_preview"></span></button>
    </div>
  </section>

  <!-- برگه‌ی محصول برای خریدار -->
  <section id="buy-sheet" class="sheet" aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <!-- بعد از خرید: بالای برگه، با دکمه‌ی خودش (دکمه‌ی پایین تلگرام روی دسکتاپ کم دیده می‌شود) -->
    <div id="buy-owned" class="owned hidden">
      <b data-i18n="owned_title"></b>
      <p data-i18n="owned_hint"></p>
      <button id="buy-show" class="btn-accent wide" data-i18n="show_content"></button>
      <button id="buy-refund" class="btn-soft wide" data-i18n="refund_btn"></button>
    </div>
    <div id="buy-rate" class="rate-box hidden">
      <b data-i18n="rate_title"></b>
      <div id="buy-stars" class="stars"></div>
    </div>
    <div id="buy-gallery" class="gallery"></div>
    <audio id="buy-audio" class="hidden" controls preload="none"></audio>
    <div id="buy-cat" class="badge"></div>
    <h2 id="buy-title" class="buy-title"></h2>
    <div class="buy-social">
      <button id="buy-like" class="like-btn"><svg><use href="#i-heart"/></svg><b id="buy-likes" class="num">0</b></button>
      <button id="buy-tip" class="text-btn hidden"><svg><use href="#i-heart"/></svg><span data-i18n="tip_btn"></span></button>
    </div>
    <p id="buy-specs" class="muted small"></p>
    <p class="verified"><svg><use href="#i-shield"/></svg><span data-i18n="verified_specs"></span></p>
    <div id="buy-desc-box" class="quote hidden"><b data-i18n="seller_desc"></b><p id="buy-desc"></p></div>
    <p id="buy-snippet" class="quote hidden"></p>
    <button id="buy-stars-help" class="stars-help hidden"><svg><use href="#i-wallet"/></svg><span data-i18n="stars_help_btn"></span></button>
    <ul class="buy-notes">
      <li id="buy-protect"></li>
      <li id="buy-sensitive" class="hidden" data-i18n="buy_sensitive"></li>
      <li data-i18n="buy_refund"></li>
    </ul>
  </section>

  <!-- «استارز ندارم»: خرید استارز (مخصوصاً در ایران با تومان) -->
  <section id="stars-sheet" class="sheet small-sheet" aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title" data-i18n="stars_title"></h2>
    <div class="stars-guide" data-i18n-html="stars_body"></div>
    <div id="stars-user" class="card stars-user">
      <span><small data-i18n="stars_username_label"></small><b id="stars-username" class="num"></b></span>
      <button id="stars-copy" class="btn-soft"><svg><use href="#i-link"/></svg><span data-i18n="copy"></span></button>
    </div>
    <p id="stars-no-user" class="warn-text hidden" data-i18n="stars_no_username"></p>
    <p class="muted small" data-i18n="stars_after"></p>
  </section>

  <!-- انعام به سازنده -->
  <section id="tip-sheet" class="sheet small-sheet" aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title" data-i18n="tip_title"></h2>
    <p class="muted small" data-i18n="tip_hint"></p>
    <div id="tip-chips" class="chips"></div>
    <div class="price-input"><input id="tip-amount" type="number" inputmode="numeric" min="1000" step="1000" placeholder="0"><span class="cur">تومان</span></div>
    <button id="tip-send" class="btn-accent wide"></button>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js"></script>
  <script src="/static/creator.js"></script>
</body>
</html>
